services:

  defect-detection:
    build: .
    container_name: industrial-defect-detection
    ports:
      - "5000:5000"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/results:/app/static/results
    restart: unless-stopped

  monitoring:
    image: python:3.11-slim
    container_name: industrial-monitoring
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir flask prometheus-client &&
             python monitoring.py"
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: industrial-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: industrial-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped